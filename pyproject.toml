[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphguard"
version = "0.1.0"
description = "Explainable graph-based detection of coordinated payment abuse."
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "pydantic>=2.8",
    "fastapi>=0.116",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"